# Alembic: migraciones de esquema. Desde la terminal solo se ESCRIBEN:
#
#   alembic revision --autogenerate -m "que cambia"
#
# Se aplican arrancando la app (ver app/plataforma/esquema.py). La base a la que se
# conecta sale de DATABASE_URL, como en la app.
[alembic]
script_location = %(here)s/app/plataforma/migraciones_esquema
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
