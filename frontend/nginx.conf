# nginx como unica puerta de entrada: SPA + proxy al backend.
# Al compartir origen, el navegador no necesita CORS y el OAuth de Google
# vuelve a este mismo puerto.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tiene que admitir lo mismo que el backend: el importador acepta Excel de
    # hasta 20 MB (routes/importar.py). Con 2 MB, un archivo de 3 MB recibia un 413
    # de nginx sin llegar a la API, y la interfaz no decia por que.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sincronizar 300 correos puede tardar: no cortar a los 60 s de rigor.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: si no, un despliegue nuevo no se ve.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
